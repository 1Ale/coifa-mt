<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="980" viewBox="0 0 1180 980">
  <rect width="1180" height="980" fill="#f7f5f1"/>
  <text x="36" y="34" font-family="ui-sans-serif,sans-serif" font-size="20" fill="#1c1917">coifa-mt — PC817 em paralelo, sem cortar fio</text>
  <text x="36" y="56" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#57534e">Hipótese ativa em baixo. Confirmar em docs/07-medicoes.md. Nenhum GND cruza a barreira.</text>

  <rect x="36" y="76" width="520" height="150" fill="#fff" stroke="#44403c"/>
  <text x="52" y="100" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#1c1917">PC817 DIP-4, visto de cima, chanfro ou ponto no pino 1</text>
  <rect x="64" y="118" width="86" height="86" fill="#ffedd5" stroke="#c2410c"/>
  <circle cx="78" cy="132" r="4" fill="#c2410c"/>
  <text x="92" y="140" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#9a3412">1</text>
  <text x="92" y="192" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#9a3412">2</text>
  <text x="124" y="140" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#9a3412">4</text>
  <text x="124" y="192" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#9a3412">3</text>
  <text x="170" y="140" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">1 anodo do LED interno</text>
  <text x="170" y="160" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">2 catodo do LED interno</text>
  <text x="170" y="180" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">3 emissor do transistor</text>
  <text x="170" y="200" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">4 coletor do transistor</text>

  <rect x="36" y="244" width="548" height="400" fill="#fff" stroke="#a8a29e"/>
  <text x="52" y="270" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#1c1917">Pulso do botão — não cortar</text>
  <text x="52" y="292" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">Descascar o fio do sinal e o GND da placa. Soldar o opto em paralelo com o contato.</text>
  <rect x="52" y="310" width="150" height="64" fill="#f5f5f4" stroke="#44403c"/>
  <text x="64" y="336" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">Botão original</text>
  <text x="64" y="356" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">fica no circuito</text>
  <line x1="202" y1="328" x2="250" y2="328" stroke="#1c1917"/>
  <line x1="202" y1="356" x2="250" y2="356" stroke="#1c1917"/>
  <text x="206" y="320" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#57534e">sinal, não cortar</text>
  <text x="206" y="374" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#57534e">GND placa, não cortar</text>
  <rect x="250" y="312" width="92" height="64" fill="#ffedd5" stroke="#c2410c"/>
  <text x="262" y="336" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#9a3412">pino 4 coletor</text>
  <text x="262" y="354" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#9a3412">pino 3 emissor</text>
  <text x="262" y="370" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#9a3412">lado coifa</text>
  <line x1="342" y1="332" x2="400" y2="332" stroke="#c2410c"/>
  <line x1="342" y1="356" x2="400" y2="356" stroke="#c2410c"/>
  <text x="348" y="324" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#c2410c">pino 1 anodo</text>
  <text x="348" y="374" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#c2410c">pino 2 catodo</text>
  <text x="404" y="328" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#1c1917">470 Ω → GPIO pulso</text>
  <text x="404" y="360" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#1c1917">GND do XIAO</text>
  <text x="52" y="420" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#1c1917">Quatro iguais: luz D0/GPIO0, baixa D1/GPIO1, média D2/GPIO2, alta D3/GPIO21.</text>
  <text x="52" y="442" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">GPIO em alto por 100 ms acende o LED do opto e o transistor fecha o botão.</text>
  <text x="52" y="464" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">GPIO em baixo: transistor aberto, botão físico segue funcionando.</text>
  <text x="52" y="500" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#9a3412">Só cortar o fio se a medida mostrar que o botão não é contato seco.</text>
  <text x="52" y="522" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#9a3412">Nesse caso parar e anotar em docs/medicoes-bancada.md. Não inserir em série.</text>

  <rect x="600" y="244" width="544" height="400" fill="#fff" stroke="#a8a29e"/>
  <text x="616" y="270" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#1c1917">Leitura do LED — não cortar</text>
  <text x="616" y="292" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">Descascar o fio que acende o LED e o GND da placa. O opto observa, não entra na série.</text>
  <rect x="616" y="310" width="160" height="64" fill="#f5f5f4" stroke="#44403c"/>
  <text x="628" y="336" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">LED do botão</text>
  <text x="628" y="356" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">fio original intacto</text>
  <line x1="776" y1="328" x2="824" y2="328" stroke="#1c1917"/>
  <text x="780" y="320" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#57534e">não cortar</text>
  <text x="828" y="324" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#1c1917">1 kΩ</text>
  <line x1="868" y1="328" x2="900" y2="328" stroke="#1c1917"/>
  <rect x="900" y="308" width="110" height="70" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="912" y="332" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#0c4a6e">pino 1 anodo</text>
  <text x="912" y="350" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#0c4a6e">pino 2 catodo</text>
  <text x="912" y="368" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#0c4a6e">lado coifa</text>
  <line x1="900" y1="366" x2="860" y2="400" stroke="#0369a1"/>
  <text x="780" y="414" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#1c1917">pino 2 no GND da placa da coifa</text>
  <text x="616" y="448" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#1c1917">pino 4 coletor → GPIO de sentido, pull-down</text>
  <text x="616" y="468" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#1c1917">pino 3 emissor → GND do XIAO</text>
  <text x="616" y="496" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">Luz D4/GPIO22, baixa D5/GPIO23, média D6/GPIO16, alta D7/GPIO17.</text>
  <text x="616" y="518" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">Alto no GPIO = LED do botão aceso. Se o brilho do painel cair, subir o resistor.</text>
  <text x="616" y="548" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#9a3412">Não colocar este opto em série com o LED. Série exige corte e apaga o painel se falhar.</text>

  <rect x="36" y="664" width="1108" height="280" fill="#fff" stroke="#a8a29e"/>
  <text x="52" y="692" font-family="ui-sans-serif,sans-serif" font-size="15" fill="#1c1917">Alimentação e antena</text>
  <text x="52" y="716" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">B0505S-2W: pino +Vin no 5 V da coifa, pino −Vin no GND da coifa. Saída +Vo no pino 5 V do XIAO, −Vo no GND do XIAO.</text>
  <text x="52" y="738" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#57534e">Se o rail for 12 V, buck para 5 V do lado da coifa, antes do B0505S. Não ligar 5 V no pino de 3,3 V.</text>
  <text x="52" y="760" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#57534e">GPIO3 em baixo habilita o RF switch. GPIO14 em alto seleciona o U.FL. Antena no forro, fora do tubo.</text>
  <text x="52" y="790" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">Regra única: derivar. O flat e os fios do painel continuam de ponta a ponta.</text>
  <text x="52" y="812" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#57534e">Ponto de derivação no conector, com fio fino soldado no pad, é melhor do que descascar o meio do flat.</text>
  <text x="52" y="834" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#57534e">Descascar no meio só se o conector não der acesso. Isolar a emenda com termoencolhível. Não interromper o condutor.</text>
  <text x="52" y="864" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#57534e">Oito PC817: quatro de pulso (laranja) e quatro de leitura (azul). Cada função tem o seu par.</text>
  <text x="52" y="886" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#57534e">Não alimentar o XIAO por USB com a coifa na rede.</text>
</svg>
