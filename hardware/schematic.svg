<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <rect width="1100" height="720" fill="#f7f5f1"/>
  <text x="40" y="36" font-family="ui-sans-serif,sans-serif" font-size="20" fill="#1c1917">coifa-mt — hipótese ativa em baixo, um canal desenhado e três iguais</text>
  <text x="40" y="58" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#57534e">Confirmar polaridade em docs/07-medicoes.md. A barreira tracejada não tem GND em comum.</text>
  <rect x="36" y="80" width="470" height="560" fill="#fff" stroke="#a8a29e"/>
  <rect x="560" y="80" width="500" height="560" fill="#fff" stroke="#a8a29e"/>
  <text x="52" y="108" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#1c1917">Lado da coifa</text>
  <text x="576" y="108" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#1c1917">Lado do rádio, isolado</text>
  <line x1="520" y1="80" x2="548" y2="80" stroke="#b45309" stroke-dasharray="4 4"/>
  <line x1="520" y1="640" x2="548" y2="640" stroke="#b45309" stroke-dasharray="4 4"/>
  <line x1="534" y1="80" x2="534" y2="640" stroke="#b45309" stroke-dasharray="5 4"/>
  <text x="500" y="668" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#b45309">isolação</text>
  <rect x="60" y="140" width="200" height="70" fill="#f5f5f4" stroke="#44403c"/>
  <text x="72" y="166" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">Placa da coifa</text>
  <text x="72" y="186" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">botão momentâneo para GND</text>
  <line x1="260" y1="162" x2="330" y2="162" stroke="#1c1917"/>
  <line x1="260" y1="188" x2="330" y2="188" stroke="#1c1917"/>
  <text x="268" y="154" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#57534e">sinal</text>
  <text x="268" y="206" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#57534e">GND placa</text>
  <rect x="330" y="140" width="70" height="56" fill="#ffedd5" stroke="#c2410c"/>
  <text x="342" y="164" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#9a3412">PC817</text>
  <text x="342" y="180" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#9a3412">saída</text>
  <line x1="400" y1="158" x2="470" y2="158" stroke="#c2410c"/>
  <line x1="400" y1="178" x2="470" y2="178" stroke="#c2410c"/>
  <text x="406" y="152" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#c2410c">LED do opto</text>
  <rect x="60" y="250" width="200" height="54" fill="#f5f5f4" stroke="#44403c"/>
  <text x="72" y="274" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">LED do botão</text>
  <text x="72" y="292" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">aceso = função ligada</text>
  <line x1="260" y1="274" x2="310" y2="274" stroke="#1c1917"/>
  <text x="314" y="270" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#57534e">1 kΩ</text>
  <line x1="348" y1="274" x2="400" y2="274" stroke="#1c1917"/>
  <rect x="400" y="252" width="70" height="48" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="412" y="274" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#0c4a6e">PC817</text>
  <text x="412" y="290" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#0c4a6e">leitura</text>
  <rect x="60" y="360" width="200" height="70" fill="#f5f5f4" stroke="#44403c"/>
  <text x="72" y="386" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">Rail 5 V da coifa</text>
  <text x="72" y="406" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">buck antes, se o rail for 12 V</text>
  <line x1="260" y1="386" x2="330" y2="386" stroke="#1c1917"/>
  <line x1="260" y1="408" x2="330" y2="408" stroke="#1c1917"/>
  <rect x="330" y="360" width="110" height="64" fill="#fef3c7" stroke="#a16207"/>
  <text x="346" y="384" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#713f12">B0505S-2W</text>
  <text x="346" y="402" font-family="ui-sans-serif,sans-serif" font-size="11" fill="#713f12">5 V → 5 V, 1 kV</text>
  <line x1="440" y1="382" x2="500" y2="382" stroke="#a16207"/>
  <line x1="440" y1="404" x2="500" y2="404" stroke="#a16207"/>
  <text x="60" y="480" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">Repetir o par de optos para baixa, média, alta e luz.</text>
  <text x="60" y="500" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">O botão físico permanece em paralelo com o transistor.</text>
  <rect x="590" y="140" width="200" height="150" fill="#ecfdf5" stroke="#047857"/>
  <text x="602" y="166" font-family="ui-sans-serif,sans-serif" font-size="14" fill="#064e3b">XIAO ESP32-C6</text>
  <text x="602" y="188" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#065f46">D0–D3 pulso dos optos</text>
  <text x="602" y="206" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#065f46">D4–D7 leitura dos LEDs</text>
  <text x="602" y="224" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#065f46">GPIO3 baixo, GPIO14 alto</text>
  <text x="602" y="242" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#065f46">5 V isolado no pino 5 V</text>
  <text x="602" y="268" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#065f46">U.FL → pigtail → forro</text>
  <rect x="820" y="150" width="200" height="54" fill="#f5f5f4" stroke="#44403c"/>
  <text x="832" y="174" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">Haste 2,4 GHz no forro</text>
  <text x="832" y="192" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">fora do tubo, 15 mm de aço</text>
  <line x1="790" y1="200" x2="820" y2="176" stroke="#047857"/>
  <text x="590" y="340" font-family="ui-sans-serif,sans-serif" font-size="13" fill="#1c1917">Matter, dois endpoints</text>
  <text x="590" y="362" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">1 On/Off Light, verdade = LED da luz</text>
  <text x="590" y="380" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">2 Fan Off/Low/Medium/High, verdade = LED da marcha</text>
  <text x="590" y="408" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">Thread pelo Apple TV. HA como segundo fabric.</text>
  <text x="590" y="500" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#57534e">Não alimentar o XIAO por USB com a coifa na rede.</text>
</svg>
